# Each entry is a PubMed search query used to seed the corpus.
# `limit` caps how many abstracts are pulled per topic.
# Add a new topic by adding a line here, then re-run scripts/ingest.py.
#
# Deliberately covers three angles per condition (causes/risk factors,
# symptoms/diagnosis, management/treatment) rather than just treatment —
# a "management guidelines" abstract often doesn't answer a "what causes
# this" question even though it's topically similar, which used to make
# the assistant refuse questions it should've been able to answer.
topics:
  # --- Type 2 diabetes ---
  - query: "type 2 diabetes management guidelines"
    limit: 20
  - query: "type 2 diabetes causes and risk factors pathophysiology"
    limit: 20
  - query: "type 2 diabetes symptoms diagnosis criteria"
    limit: 15

